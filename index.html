<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu historia importa, no la cierres – the game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap">
<style>
:root{--bg:#f0a64a;--panel:#e89a3c;--ink:#1c1a18;--chalk:#ece6d8;--accent:#8a5a44;--card:#f6efe0;--tilt:22deg;--font:'Permanent Marker','Chalkboard SE','Comic Sans MS',cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);min-height:100vh;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.5px);background-size:14px 14px}
h1{margin:6px 10px;font-size:clamp(18px,4vw,30px);text-align:center;line-height:1.1}h1 small{display:block;font-size:.5em;opacity:.7}
.wrap{display:grid;grid-template-columns:230px 1fr;gap:12px;padding:8px 12px 20px;max-width:1100px;margin:auto}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.side{background:var(--ink);color:var(--chalk);border-radius:14px;padding:10px;text-align:center}
.side img{width:110px;background:#fff;padding:4px;border-radius:6px;image-rendering:pixelated}
.stage{perspective:1100px;overflow:hidden;padding-bottom:6px}
.table{transform:rotateX(var(--tilt)) scale(.92);transform-style:preserve-3d;background:radial-gradient(circle at 50% 40%,var(--panel),color-mix(in srgb,var(--panel) 70%,#000));border:4px solid var(--ink);border-radius:22px;padding:12px;box-shadow:0 30px 40px rgba(0,0,0,.35);min-height:440px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:116px;transform-style:preserve-3d}
.c{width:72px;height:101px;transform:translateZ(18px);transition:.2s;user-select:none;filter:drop-shadow(3px 6px 0 rgba(0,0,0,.3))}
.c svg{width:100%;height:100%;display:block}
.mine .c{cursor:pointer}.mine .c:hover{transform:translateZ(50px) translateY(-14px) rotateY(10deg) rotateZ(-3deg)}
.play{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;min-height:110px}
.pair{display:flex;flex-direction:column;gap:2px;align-items:center}
.msg{text-align:center;background:var(--ink);color:var(--chalk);border-radius:10px;padding:6px 10px;font-size:15px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:38px}
button{font-family:inherit;font-size:15px;background:var(--ink);color:var(--chalk);border:2px solid var(--chalk);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(20,15,10,.75);display:grid;place-items:center;z-index:5;padding:16px}
.box{background:var(--bg);border:4px solid var(--ink);border-radius:18px;padding:18px;max-width:430px;text-align:center;font-size:17px;max-height:92vh;overflow:auto}
.box h2{margin:.2em 0}.box .btns{margin-top:10px}.box img{width:150px;background:#fff;padding:5px;border-radius:6px;image-rendering:pixelated}
details{background:var(--ink);color:var(--chalk);border-radius:12px;margin-top:10px;padding:8px;font-size:14px}
details label{display:inline-flex;align-items:center;gap:4px;margin:4px 8px 4px 0}
input[type=color]{width:34px;height:26px;border:0;padding:0;background:none}
.tag{font-size:12px;opacity:.8}
.side svg{width:100%;height:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;flex-wrap:wrap;max-width:1100px;margin:auto}
header h1{flex:1;min-width:200px}.logo{background:#fff;border-radius:10px;padding:3px 8px;height:52px}
.grp{background:var(--ink);color:var(--chalk);border-radius:10px;padding:8px 12px;font-size:14px}
select{font-family:inherit;background:var(--chalk);border:2px solid var(--ink);border-radius:8px;padding:4px;max-width:100%}
.box input{width:100%;font-size:13px;padding:6px;margin:6px 0}
.mc{width:46px;height:64px;margin:0 auto 2px}.mc svg{width:100%;height:100%}
.atun{margin:12px 0;background:#2b2825;border:2px solid var(--chalk);border-radius:12px;padding:8px}.atun>svg{width:84px;display:block;margin:auto}
.bub{background:var(--chalk);color:var(--ink);border-radius:12px;padding:8px;font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:15px;margin:6px 0;text-align:left;line-height:1.25}
.atun .btns{flex-direction:column}.atun button{font-size:13px}
.box p{margin:.4em 0}.box ul,.box ol{margin:.3em 0;padding-left:20px;font-size:15px}
</style></head><body>

const HT={how:`<h2>📖 Cómo se juega</h2><ol><li>Cada ronda es una mano de truco: se reparten 3 cartas a cada jugador.</li><li>Si <b>ganás la ronda</b>, te llevás 1 de las 6 piezas del rompecabezas.</li><li>Si <b>perdés</b>, elegís una carta temática para charlar: <b>Romper el hielo</b> (preguntas simples), <b>Bancar</b> (cómo apoyar a un amigo) o <b>Mito y Posta</b> (falsas creencias sobre la salud mental y la realidad).</li><li>Gana quien primero completa las 6 piezas y arma el mensaje: «Tu historia importa, no la cierres».</li><li>Podés jugar contra el Gatobot o invitar a un amigo con un link o un QR. Yo te voy dando consejos en cada jugada 😺</li></ol>`,
truco:`<h2>🗣️ Truco y envido</h2><ul><li><b>Bazas:</b> cada ronda tiene hasta 3 bazas. En cada una se tira una carta y gana la más fuerte. Quien gana 2 bazas gana la ronda.</li><li><b>Parda:</b> si empatan una baza, decide quien ganó la primera. Si empatan todas, gana el mano (quien empezó la ronda).</li><li><b>Truco:</b> apostás a que tu mano es mejor. El rival responde «Quiero», «No quiero» (te llevás la ronda) o sube a <b>Retruco</b> y <b>Vale cuatro</b>.</li><li><b>Envido:</b> solo antes de tirar tu primera carta. Gana quien tenga más tantos: dos cartas del mismo palo suman 20 más sus valores (los 10, 11 y 12 valen 0); si no, vale la carta más alta. En esta versión es un desafío aparte y no da piezas.</li></ul>`};
function helpBox(){const tabs=[['how','📖 Cómo se juega'],['truco','🗣️ Truco y envido'],['rank','🃏 Cartas']].map(([k,l])=>`<button onclick="HELP='${k}';render()" ${HELP==k?'style="background:var(--accent)"':''}>${l}</button>`).join('');

return `<div class="box" style="text-align:left;max-width:500px"><div class="btns">${tabs}</div>${body}<div class="btns"><button onclick="HELP=null;render()">Entendido, Atún 😺</button></div></div>`}
const TIPS=['Las cartas más fuertes son el ancho de espada y el ancho de basto: guardalas para el momento justo.','Si ganás la primera baza, jugá tranquilo la segunda: con ganar una más, la ronda es tuya.','Cantar truco con cartas flojas es un farol: es parte del juego, pero el rival puede aceptar.','Perder una ronda no es perder el juego: una carta temática puede ser una linda charla.','Con dos cartas del mismo palo tenés envido: 20 más el valor de ambas.'];let ti=0;

function advice(v){const o=1-v;if(!S.h)return 'Hola, soy Atún 😺 Elegí la dificultad y arrancamos. Si tenés dudas, tocá «¿Cómo se juega?».';if(seat()<0)return 'Estás mirando la partida. ¡Prestá atención y aprendé!';
if(S.phase=='pick')return S.loser==v?'Perdiste la ronda, ¡no pasa nada! Elegí una carta temática y charlen un rato.':'Ganaste la ronda 🎉 Ahora tu rival elige una carta para conversar.';
if(S.phase=='card')return 'Leé la carta en voz alta y charlen un ratito antes de seguir. Escuchar también es jugar.';
if(S.phase=='end')return S.win==v?'¡Armaste el rompecabezas! Escaneá el QR de ayuda: tu historia importa.':'Esta vez lo armó tu rival. Escaneá el QR de ayuda: tu historia importa.';
const P=S.pend,h=S.h[v],st=Math.max(...h.map(POW),0)+(S.bz.includes(v)?3:0),e=env(S.o[v]);
if(P&&P.from!=v){if(P.t=='envido')return `Tenés ${e} de envido. `+(e>=27?'Es un gran número: aceptá con «Quiero».':e<=22?'Es bajo: conviene decir «No quiero».':'Está parejo: arriesgá si te animás.');
return st>=12?'Tenés cartas muy fuertes: aceptá y hasta podés subir la apuesta.':st>=8?'Tu mano es decente: «Quiero» es una buena opción.':'Tu mano es floja: puede convenir «No quiero» y cortar acá.'}
if(P)return 'Esperando la respuesta de '+name(o)+'…';
if(S.turn!=v)return 'Es el turno de '+name(o)+'. Mientras tanto, mirá qué cartas va jugando.';
if(S.pl[o].length>S.pl[v].length){const t=POW(S.pl[o][S.pl[o].length-1]),w=h.filter(c=>POW(c)>t).sort((a,b)=>POW(a)-POW(b))[0];return w?'Podés ganarle con tu '+cn(w)+': es la más baja que le gana.':'Ninguna de tus cartas le gana: tirá la más baja y guardá las fuertes.'}
if(!S.ed&&!S.bz.length&&!S.pl[v].length&&S.lvl==1)return `Antes de tirar: tenés ${e} de envido. `+(e>=27?'¡Podés cantar «Envido»!':'No parece para cantarlo.');
return st>=12?'Tenés cartas de peso: podés cantar «Truco» o guardar la fuerte para la próxima baza.':'Jugá una carta media y guardá la mejor para después.'}
const POW=c=>({'1E':14,'1B':13,'7E':12,'7O':11})[c.n+c.s]||({3:10,2:9,1:8,12:7,11:6,10:5,7:4,6:3,5:2,4:1})[c.n];
const val=c=>c.n>=10?0:c.n;
function env(h){let m=0;for(const a of h){m=Math.max(m,val(a));for(const b of h)if(a!==b&&a.s===b.s)m=Math.max(m,20+val(a)+val(b))}return m}
let S={pcs:[0,0],mano:1,guest:null,mode:'bot'},room=null,isHost=true,myId=Math.random().toString(36).slice(2,8),bt;
const seat=()=>isHost?0:(S.guest===myId?1:-1);
const name=p=>S.guest?'Jugador '+(p+1):(p?'Gatobot 🤖':'Vos');
function deal(){const d=[];for(const s of 'EBOC')for(const n of [1,2,3,4,5,6,7,10,11,12])d.push({n,s});d.sort(()=>Math.random()-.5);
Object.assign(S,{h:[d.slice(0,3),d.slice(3,6)],pl:[[],[]],bz:[],mano:1-S.mano,lvl:1,lr:-1,pend:null,ed:false,phase:'play',card:null,msg:'¡Nueva ronda!'});
S.o=[[...S.h[0]],[...S.h[1]]];S.turn=S.mano}
function endHand(r,m){S.pcs[r]++;S.msg=m+' '+name(r)+' se lleva una pieza 🧩';S.pend=null;if(S.pcs[r]>=6){S.phase='end';S.win=r}else{S.phase='pick';S.loser=1-r}}
function apply(p,a,i){const o=1-p,P=S.pend;if(S.phase=='end'){if(a=='again'&&p==0){S.pcs=[0,0];deal()}return}
if(S.phase=='pick'){if(a=='pick'&&p==S.loser){S.card=CARDS[i][Math.random()*4|0];S.ck=i;S.phase='card'}}
else if(S.phase=='card'){if(a=='next')deal()}
else if(P){if(P.from==p)return;
 if(a=='yes'||a=='up'){if(P.t=='truco'){S.lvl=P.to;S.lr=P.from;S.pend=a=='up'&&P.to<4?{t:'truco',from:p,to:P.to+1}:null;S.msg=name(p)+': '+(S.pend?'¡'+TN[S.pend.to]+'!':'¡Quiero!')}
  else{const a0=env(S.o[0]),a1=env(S.o[1]),w=a0>a1?0:a1>a0?1:S.mano;S.ed=true;S.pend=null;S.msg='Envido: '+a0+' vs '+a1+' → gana '+name(w)}
  if(!S.pend)S.turn=P.from}
 else if(a=='no'){if(P.t=='truco')endHand(P.from,name(p)+': no quiero.');else{S.ed=true;S.pend=null;S.turn=P.from;S.msg=name(p)+': no quiero el envido'}}}
else if(p==S.turn){
 if(a=='play'){const c=S.h[p][i];if(!c)return;S.h[p].splice(i,1);S.pl[p].push(c);
  if(S.pl[o].length<S.pl[p].length){S.turn=o;return}
  const b=S.bz.length,x=POW(S.pl[0][b]),y=POW(S.pl[1][b]),w=x>y?0:y>x?1:'t';S.bz.push(w);
  const n=S.bz.length,w0=S.bz.filter(k=>k===0).length,w1=S.bz.filter(k=>k===1).length;let r=-1;
  if(w0>=2)r=0;else if(w1>=2)r=1;else if(n==2&&w0+w1==1)r=w0?0:1;else if(n==3)r=w0>w1?0:w1>w0?1:(S.bz[0]!=='t'?S.bz[0]:S.mano);
  if(r>=0)endHand(r,'Fin de la ronda.');else{S.turn=w==='t'?S.mano:w;S.msg=w==='t'?'Parda (empate)':name(w)+' gana la mano'}}
 else if(a=='truco'&&S.lvl<4&&S.lr!=p){S.pend={t:'truco',from:p,to:S.lvl+1};S.msg=name(p)+': ¡'+TN[S.lvl+1]+'!'}
 else if(a=='envido'&&!S.ed&&!S.bz.length&&!S.pl[p].length&&S.lvl==1){S.pend={t:'envido',from:p};S.msg=name(p)+': ¡Envido!'}}}
const bstr=()=>Math.max(...S.h[1].map(POW),0)+(S.bz.includes(1)?3:0);
function botTick(){if(S.guest||S.diff==null)return;clearTimeout(bt);bt=setTimeout(()=>{const P=S.pend,h=S.h[1],D=S.diff,go=(a,i)=>{apply(1,a,i);sync()};
if(S.phase=='pick'&&S.loser==1)return go('pick',Math.random()*3|0);if(S.phase!='play')return;
if(P&&P.from==0){const st=bstr();return P.t=='envido'?go(env(S.o[1])>=[31,25,22][D]?'yes':'no'):go(st>=[11,9,8][D]||Math.random()<[0,.2,.1][D]?(st>=[99,12,11][D]&&P.to<4&&Math.random()<.45?'up':'yes'):'no')}
if(P||S.turn!=1)return;
if(!S.ed&&!S.bz.length&&!S.pl[1].length&&S.lvl==1&&env(S.o[1])>=[99,27,24][D]&&Math.random()<.6)return go('envido');
if(S.lvl<4&&S.lr!=1&&((bstr()>=[99,12,10][D]&&Math.random()<.4)||Math.random()<[0,0,.08][D]))return go('truco');
let i;const low=()=>h.reduce((a,b,k)=>POW(b)<POW(h[a])?k:a,0);
if(Math.random()<[.6,.12,0][D])i=Math.random()*h.length|0;
else if(S.pl[0].length>S.pl[1].length){const t=POW(S.pl[0][S.pl[0].length-1]),w=h.map((c,k)=>k).filter(k=>POW(h[k])>t);i=w.length?w.reduce((a,b)=>POW(h[a])<POW(h[b])?a:b):low()}else i=h.reduce((a,b,k)=>POW(b)>POW(h[a])?k:a,0);
go('play',i)},900)}
function setDiff(d){const f=S.diff==null;S.diff=d;if(f){S.pcs=[0,0];deal()}sync()}
function sync(){render();if(room&&isHost)room.emit('state',S);botTick()}
function act(a,i){const s=seat();if(s<0)return;if(isHost){apply(0,a,i);sync()}else room.emit('act',{id:myId,a,i})}
function render(){const v=Math.max(seat(),0),o=1-v,me=seat()>=0;
if(S.guest)INV=null;$('puz').innerHTML=puz(S.pcs[v]);$('dif').value=S.diff==null?1:S.diff;$('tip').textContent=advice(v);
$('rv').textContent=name(o)+': '+S.pcs[o]+'/6 piezas';
$('opp').innerHTML=S.h?S.h[o].map(backH).join(''):'';
$('play').innerHTML=S.pl?[0,1,2].filter(b=>S.pl[v][b]||S.pl[o][b]).map(b=>`<div class="pair">${S.pl[o][b]?cardH(S.pl[o][b]):''}${S.pl[v][b]?cardH(S.pl[v][b]):''}</div>`).join(''):'';
$('me').innerHTML=S.h?S.h[v].map((c,i)=>`<div onclick="act('play',${i})">${cardH(c)}</div>`).join(''):'';
$('msg').textContent=S.msg||'';
let b='',P=S.pend;
if(me&&S.phase=='play'){if(P&&P.from!=v){b=`<button onclick="act('yes')">✅ Quiero</button><button onclick="act('no')">❌ No quiero</button>`+(P.t=='truco'&&P.to<4?`<button onclick="act('up')">⬆️ ${TN[P.to+1]}</button>`:'')}
else if(P)b='Esperando respuesta…';
else if(S.turn==v){if(S.lvl<4&&S.lr!=v)b+=`<button onclick="act('truco')">🗣️ ${TN[S.lvl+1]}</button>`;if(!S.ed&&!S.bz.length&&!S.pl[v].length&&S.lvl==1)b+=`<button onclick="act('envido')">🃏 Envido</button>`;b+=' Tu turno'}else b='Turno de '+name(o)+'…'}
$('btns').innerHTML=b;
let ov='';
if(S.phase=='pick')ov=S.loser==v&&me?`<div class="box"><h2>Perdiste la ronda 😿</h2>Elegí una carta para charlar:<div class="btns">${KIND.map((k,i)=>`<button onclick="act('pick',${i})">${k}</button>`).join('')}</div></div>`:`<div class="box">${name(S.loser)} está eligiendo una carta temática…</div>`;
if(S.phase=='card')ov=`<div class="box"><h2>${KIND[S.ck]}</h2><p style="white-space:pre-line">${S.card}</p><div class="btns"><button onclick="act('next')">Seguir jugando ➜</button></div></div>`;
if(S.phase=='end')ov=`<div class="box"><h2>🎉 TU HISTORIA IMPORTA, NO LA CIERRES</h2>${name(S.win)} completó el rompecabezas.<br><br><img src="${QR}" alt="QR"><p style="font-size:15px">Escaneá el QR para ver los canales de ayuda. Si estás pasando un mal momento, hablá con alguien de confianza o llamá a la Línea 135 (CABA y GBA).</p>${v==0?'<div class="btns"><button onclick="act(\'again\')">🔁 Jugar de nuevo</button></div>':''}</div>`;
if(ready&&S.diff==null&&isHost)ov=`<div class="box"><h2>Elegí la dificultad</h2><div class="btns" style="flex-direction:column"><button onclick="setDiff(0)">🌱 Demostración (fácil)</button><button onclick="setDiff(1)">⚖️ Nivelado (normal)</button><button onclick="setDiff(2)">🔥 Pelea contra vos mismo (difícil)</button><button onclick="startInvite()">👥 Jugar con un amigo</button></div></div>`;
if(HELP)ov=helpBox();
if(INV)ov=invBox();
$('ovh').innerHTML=ov?`<div class="ov">${ov}</div>`:'';
$('net').textContent=S.guest?(me?'🌐 Multijugador · sos el Jugador '+(seat()+1):'👀 Mirando la partida'):(room?'🌐 Mesa privada lista: esperando a tu amigo':'Modo solo vs Gatobot')}
let INV=null,ready=false,hc=false,got=false,RM=null;
async function join(code,force){RM=RM||await claude.use('room').catch(()=>null);if(!RM){ready=true;render();return false}
if(room){try{room.leave()}catch(e){}}
hc=false;got=false;room=await RM.join('m-'+code);
room.on('state',m=>{if(m.isMe||hc)return;got=true;isHost=false;S=m.data;render()});
room.on('act',m=>{if(!isHost||m.isMe)return;const d=m.data;if(d.id===S.guest){apply(1,d.a,d.i);sync()}});
room.on('hello',m=>{if(!isHost||m.isMe)return;const id=m.data.id;if(!S.guest){S.guest=id;if(S.diff==null)S.diff=1;S.pcs=[0,0];deal()}sync()});
if(force){hc=true;isHost=true;S={pcs:[0,0],mano:1,guest:null,diff:S.diff};if(S.diff!=null)deal();ready=true;sync();return true}
for(let k=0;k<3&&!got;k++){room.emit('hello',{id:myId}).catch(()=>{});await new Promise(r=>setTimeout(r,900))}
if(!got){hc=true;isHost=true}ready=true;sync();return true}
